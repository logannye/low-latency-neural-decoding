name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch wheels
        run: >-
          python -m pip install --only-binary=:all:
          'torch>=2.6,<3' 'torchvision>=0.21,<1'
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test tools
        run: python -m pip install --only-binary=:all: -e '.[dev,benchmark,neural,runtime]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Exercise the documented workflow
        run: |
          python scripts/make_demo_data.py --output data/demo
          cnn-train --data-dir data/demo --epochs 2 --checkpoint checkpoints/demo.pt
          cnn-evaluate --checkpoint checkpoints/demo.pt --data-dir data/demo/test
          cnn-predict --checkpoint checkpoints/demo.pt --image "$(find data/demo/test -name '*.png' -print -quit)"
