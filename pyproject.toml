[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-neural-decoding"
version = "0.1.0"
description = "Causal neural decoding under recording drift and real-time runtime constraints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
benchmark = [
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "psutil>=6,<8",
]
neural = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "h5py>=3.11,<4",
    "pynwb>=2.8,<4",
    "threadpoolctl>=3,<4",
]
runtime = [
    "onnx==1.19.1",
    "onnxruntime==1.23.2",
    "psutil>=6,<8",
]

[project.scripts]
cnn-train = "classifier.train:main"
cnn-evaluate = "classifier.evaluate:main"
cnn-predict = "classifier.predict:main"
cnn-benchmark = "classifier.benchmark:main"
neural-decode = "neural_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
